<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Collector</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 300px;
            padding: 15px;
            margin: 0;
            background-color: #f8f9fa;
        }
        h1 {
            font-size: 18px;
            margin-top: 0;
            color: #343a40;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            display: none;
        }
        .status-ok {
            background-color: #d4edda;
            color: #155724;
            display: block !important;
        }
        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            display: block !important;
        }
        .status-info {
            background-color: #e2e3e5;
            color: #383d41;
            display: block !important;
        }
    </style>
</head>
<body>
    <h1>News Collector</h1>
    <button id="collectNews">Collect Current Page</button>
    <div id="status"></div>
    <script src="popup.js"></script>
</body>
</html>
