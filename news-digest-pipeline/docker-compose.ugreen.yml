# UGREEN NAS / Container Manager compose.
# Use this file instead of Traefik production compose.
#
# In UGREEN Docker / Container Manager:
#   1. Copy news-digest-pipeline including prompts/ (prompt.md, config.md, assembly_prompt.md)
#      onto a NAS share, e.g. /volume1/docker/news-digest-pipeline
#   2. Copy .env.example → .env and fill every key you use
#   3. Create a Project with this compose file, or:
#        docker compose -f docker-compose.ugreen.yml up -d --build
#
# Prefer the homelab deploy: news-digest/scripts/deploy-nas.sh
# Host 3010 (Sure already uses 3000). Dashboard: http://127.0.0.1:3010

services:
  news-digest:
    build: .
    image: news-digest-pipeline:ugreen
    container_name: news-digest-pipeline
    restart: unless-stopped
    ports:
      - "3010:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/news-digest.db
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./production/image/output:/app/production/image/output
      - ./production/video/output:/app/production/video/output
      - ./prompts:/app/prompts:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
